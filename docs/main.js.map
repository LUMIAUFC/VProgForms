<div ngbDropdown class="d-inline-block {{ mode }}">
    <button id="btn-dropdown-comandos" type="button" class="dropdown btn btn-primary p-3" ngbDropdownToggle
        [title]="title | translate">
        <span *ngIf="text == true && text2==false">{{ "COMANDS.TITLE" | translate }}</span>
        <span *ngIf="text == false && iconComands ==true" class="bi bi-code-slash"></span>
        <span *ngIf="text == false && iconComands == false" class="bi bi-code-slash"></span>
        <span class="color-black" *ngIf="text2 == true" tabindex="-1">{{ "COMANDS.TITLE2" | translate }}</span>
    </button>
    <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
        <button class="dropdown-item" tabindex="0" *ngIf="hasVariables" (click)="addVariable()" aria-keyshortcuts="Alt+1">{{
            "COMANDS.BUTTON.NEW_VARIABLE" | translate }}</button>
        <button class="dropdown-item" tabindex="0" (click)="addOperator()" aria-keyshortcuts="Alt+2">{{ "COMANDS.BUTTON.MATH" | translate
            }}</button>
        <button class="dropdown-item" tabindex="0" (click)="addWriter()" aria-keyshortcuts="Alt+3">{{ "COMANDS.BUTTON.WRITE" | translate }}
        </button>
        <button class="dropdown-item" tabindex="0" (click)="addConditional()" aria-keyshortcuts="Alt+4">{{ "COMANDS.BUTTON.IF" | translate
            }}</button>
        <button class="dropdown-item" tabindex="0" (click)="addFor()" aria-keyshortcuts="Alt+5">{{ "COMANDS.BUTTON.WHILE" | translate }}</button>
    </div>
</div>
