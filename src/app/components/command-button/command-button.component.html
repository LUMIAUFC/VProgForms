<div ngbDropdown #cmdDropdown="ngbDropdown" (openChange)="onDropdownOpenChange($event)" container="body" class="d-inline-block {{ mode }}" [class.add-block]="variant === 'add-block'">
    <button [attr.id]="buttonId" type="button"
        [ngClass]="variant === 'add-block' ? 'dropdown btn btn-primary btn-sm add-block-btn' : 'dropdown btn btn-primary p-3'"
        ngbDropdownToggle aria-haspopup="menu" [attr.title]="title ? (title | translate) : null" [attr.aria-label]="(title || 'COMANDS.TITLE') | translate">
        <span *ngIf="variant === 'add-block'" class="bi bi-plus-lg" aria-hidden="true"></span>
        <span *ngIf="variant === 'add-block' && text2 == true" class="ms-1">{{ "COMANDS.TITLE2" | translate }}</span>
        <span *ngIf="variant !== 'add-block' && text == true && text2 == false">{{ "COMANDS.TITLE" | translate }}</span>
        <span *ngIf="variant !== 'add-block' && text == false && iconComands == true" class="bi bi-code-slash" aria-hidden="true"></span>
        <span *ngIf="variant !== 'add-block' && text == false && iconComands == false" class="bi bi-code-slash" aria-hidden="true"></span>
        <span class="color-black" *ngIf="variant !== 'add-block' && text2 == true" tabindex="-1">{{ "COMANDS.TITLE2" | translate }}</span>
    </button>
    <div ngbDropdownMenu role="menu" [attr.aria-labelledby]="buttonId">
        <button type="button" role="menuitem" ngbDropdownItem class="d-flex align-items-center justify-content-between gap-3"
            *ngIf="hasVariables" (click)="addVariable(); cmdDropdown.close()">
            <span><span class="sr-only">Alt+1, </span>{{ "COMANDS.BUTTON.NEW_VARIABLE" | translate }}</span>
            <kbd class="key-shortcut" aria-hidden="true">Alt+1</kbd>
        </button>
        <button type="button" role="menuitem" ngbDropdownItem class="d-flex align-items-center justify-content-between gap-3"
            (click)="addOperator(); cmdDropdown.close()">
            <span><span class="sr-only">Alt+2, </span>{{ "COMANDS.BUTTON.MATH" | translate }}</span>
            <kbd class="key-shortcut" aria-hidden="true">Alt+2</kbd>
        </button>
        <button type="button" role="menuitem" ngbDropdownItem class="d-flex align-items-center justify-content-between gap-3"
            (click)="addWriter(); cmdDropdown.close()">
            <span><span class="sr-only">Alt+3, </span>{{ "COMANDS.BUTTON.WRITE" | translate }}</span>
            <kbd class="key-shortcut" aria-hidden="true">Alt+3</kbd>
        </button>
        <button type="button" role="menuitem" ngbDropdownItem class="d-flex align-items-center justify-content-between gap-3"
            (click)="addConditional(); cmdDropdown.close()">
            <span><span class="sr-only">Alt+4, </span>{{ "COMANDS.BUTTON.IF" | translate }}</span>
            <kbd class="key-shortcut" aria-hidden="true">Alt+4</kbd>
        </button>
        <button type="button" role="menuitem" ngbDropdownItem class="d-flex align-items-center justify-content-between gap-3"
            (click)="addFor(); cmdDropdown.close()">
            <span><span class="sr-only">Alt+5, </span>{{ "COMANDS.BUTTON.WHILE" | translate }}</span>
            <kbd class="key-shortcut" aria-hidden="true">Alt+5</kbd>
        </button>
    </div>
</div>
